[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-classifier"
version = "0.1.0"
description = "Research-grade multiclass software defect severity classification"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Emina Efendic" }]
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
defect-classifier = "defect_classifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
