dataset:
  paths:
    - data/raw/eclipse/MYLYN_dataset_issues.csv
    - data/raw/eclipse/TPTP_dataset_issues.csv
    - data/raw/eclipse/Papyrus_dataset_issues.csv
    - data/raw/eclipse/PDE_dataset_issues.csv
  chunksize: 50000

output:
  root_dir: reports
  experiments_dir: reports/experiments

processed:
  core_dir: data/processed/eclipse_core

training:
  enabled: false

cv:
  strategy: auto
  n_splits: 3
  shuffle: false
  random_state: 42

readiness:
  minimum_total_rows: 500
  minimum_class_rows: 20
  rare_class_warning: 100
