dataset:
  path: data/raw/sample_data.csv
  chunksize: 50000

output:
  root_dir: reports
  experiments_dir: reports/experiments

source_columns:
  id: [id, bug_id, issue_id, report_id]
  summary: [summary, short_desc, title]
  description: [description, details, long_desc, body]
  severity: [severity, sev]
  creation_time: [creation_time, creation time, created_at, creation date]
  product: [product]
  component: [component]
  dupe_of: [dupe_of, dupe of, duplicate_of]

target_column: severity
label_exclusions:
  - enhancement
  - task
  - feature
  - unknown
  - n/a
  - none
  - ""

label_grouping:
  enabled: false
  groups:
    high: [blocker, critical]
    medium: [major, normal]
    low: [minor, trivial]

text_columns:
  summary: summary
  description: description

cleaning:
  lowercase: true
  remove_html: true
  replace_urls: true
  replace_emails: true
  remove_code_blocks: false
  remove_stack_traces: false
  normalize_unicode: true
  normalize_whitespace: true

split:
  strategy: chronological
  train_fraction: 0.8
  random_state: 42
  allow_missing_dates_fallback: false

features:
  representation: summary_description
  analyzer: word
  ngram_range: [1, 1]
  min_df: 1
  max_df: 1.0
  max_features: 50000
  sublinear_tf: true
  lowercase: false

models:
  enabled:
    - DummyClassifier
    - MultinomialNB
    - LogisticRegression
    - LinearSVC
  search_method: grid
  search_iterations: 6
  class_weight: balanced
  random_state: 42
  param_grids:
    DummyClassifier: {}
    MultinomialNB:
      clf__alpha: [0.1, 0.5, 1.0]
      tfidf__ngram_range: [[1, 1], [1, 2]]
    LogisticRegression:
      clf__C: [0.5, 1.0, 2.0]
      tfidf__ngram_range: [[1, 1], [1, 2]]
    LinearSVC:
      clf__C: [0.5, 1.0, 2.0]
      tfidf__ngram_range: [[1, 1], [1, 2]]

cv:
  strategy: auto
  n_splits: 3
  shuffle: true
  random_state: 42

primary_metric: macro_f1

bootstrap:
  n_resamples: 1000
  confidence_level: 0.95
  random_state: 42
